services:
  postgres:
    image: postgres:15-alpine
    container_name: mi_proyecto_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: servicio_tecnico
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lol11990
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mi_proyecto_network

volumes:
  postgres_data:

networks:
  mi_proyecto_network:
    driver: bridge